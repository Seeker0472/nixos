###################
### KEYBINDINGS ###
###################

# TODO:Move to window
# TODO:Move workspaces-MultiDis
# set window property

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod CONTROL SHIFT, M, exit,
bind = $mainMod, M, exec, hyprlock
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, D, exec, $menu
#bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, J, togglesplit, # dwindle

# Terminals
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $terminal --class FG

# Window Actions
bind = $mainMod, Q, killactive
bind = $mainMod, T, togglefloating,
bind = $mainMod, T, centerwindow,
bind = $mainMod, F, fullscreen,
bind = $mainMod, G, pin, #TODO:color?

# Move workspaces
bind = $mainMod SHIFT, H, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT, J, movecurrentworkspacetomonitor, d
bind = $mainMod SHIFT, K, movecurrentworkspacetomonitor, u
bind = $mainMod SHIFT, L, movecurrentworkspacetomonitor, r
bind = $mainMod SHIFT, b, movecurrentworkspacetomonitor, +1
bind = $mainMod, b, focusmonitor, +1

bind = $mainMod SHIFT, left, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT, right, movecurrentworkspacetomonitor, d
bind = $mainMod SHIFT, up, movecurrentworkspacetomonitor, u
bind = $mainMod SHIFT, down, movecurrentworkspacetomonitor, r

# Move focus -> HJKL&lrud&Tab
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, TAB, cyclenext


# Switch workspaces [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# special workspaces

bind = $mainMod, C, workspace, 200
bind = $mainMod, C, execr,  [ "$(hyprctl activeworkspace | grep windows | awk '{print $2}')" -eq 0 ] && firefox &
bind = $mainMod, V, workspace, 201
bind = $mainMod, V, execr,  [ "$(hyprctl activeworkspace | grep windows | awk '{print $2}')" -eq 0 ] && code &
bind = $mainMod, 0, workspace, 202
bind = $mainMod, 0, execr,  [ "$(hyprctl activeworkspace | grep windows | awk '{print $2}')" -eq 0 ] && qq &
bind = $mainMod, W, workspace, 203
bind = $mainMod, W, execr,  [ "$(hyprctl activeworkspace | grep windows | awk '{print $2}')" -eq 0 ] && QT_SCALE_FACTOR=1.6 wechat-uos &
bind = $mainMod, O, workspace, 204
bind = $mainMod, O, execr,  [ "$(hyprctl activeworkspace | grep windows | awk '{print $2}')" -eq 0 ] && obsidian &

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows 
bind = $mainMod CONTROL, H, moveactive, -100 0
bind = $mainMod CONTROL, L, moveactive, 100 0
bind = $mainMod CONTROL, K, moveactive, 0 -100
bind = $mainMod CONTROL, J, moveactive, 0 100

bind = $mainMod CONTROL, left, moveactive, -100 0
bind = $mainMod CONTROL, right, moveactive, 100 0
bind = $mainMod CONTROL, up, moveactive, 0 -100
bind = $mainMod CONTROL, down, moveactive, 0 100

bindm = $mainMod, mouse:272, movewindow

bind = $mainMod ALT, H, resizeactive, -100 0
bind = $mainMod ALT, L, resizeactive, 100 0
bind = $mainMod ALT, K, resizeactive, 0 -100
bind = $mainMod ALT, J, resizeactive, 0 100

bind = $mainMod ALT, left, resizeactive, -100 0
bind = $mainMod ALT, right, resizeactive, 100 0
bind = $mainMod ALT, up, resizeactive, 0 -100
bind = $mainMod ALT, down, resizeactive, 0 100

bindm = $mainMod, mouse:273, resizewindow

# wofi
bind = $mainMod, P, exec, bash ~/.config/wofi/wofi.sh menu
bind = $mainMod SHIFT, P, exec, bash ~/.config/wofi/wofi.sh power

#screenshoot
bind = $mainMod, A,exec, grim -g "$(slurp)" 
bind = $mainMod SHIFT, A,exec, grim

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous



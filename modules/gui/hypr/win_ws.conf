##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Warn:workaruond for hyprland's bug!!!!!

# float&pin kitty
windowrulev2 = float, initialClass:(.*F.*),initialTitle:^(kitty)$
windowrulev2 = size 70% 70%, initialClass:(.*F.*),initialTitle:^(kitty)$
windowrulev2 = pin , initialClass:(.*G.*),initialTitle:^(kitty)$

# Right-Up of screen
windowrulev2 = size 60% 60% , initialClass:^(RT.*), initialTitle:^(kitty)$
windowrulev2 = float , initialClass:^(RT.*), initialTitle:^(kitty)$
windowrulev2 = move 40% 30 , initialClass:^(RT.*), initialTitle:^(kitty)$

# Thunar Float
windowrulev2 = size 70% 70%, initialClass:^(thunar)$,
windowrulev2 = float , initialClass:^(thunar)$,

# qq pic
windowrulev2 = size 70% 70% , initialClass:^(QQ)$, initialTitle:^(图片查看器)$
windowrulev2 = float , initialClass:^(QQ)$, initialTitle:^(图片查看器)$

# wechat pic & no-border
windowrulev2 = size 70% 70% , initialClass:^(wechat)$, initialTitle:^(预览)$
windowrulev2 = float , initialClass:^(wechat)$, initialTitle:^(预览)$

windowrulev2 = noborder , initialClass:^(wechat)$, 
windowrulev2 = noshadow , initialClass:^(wechat)$, 
windowrulev2 = noblur , initialClass:^(wechat)$, 

# hmcl no border
windowrulev2 = noborder , initialClass:^(org\.jackhuang\.hmcl\.Launcher)$, 
windowrulev2 = noshadow , initialClass:^(org\.jackhuang\.hmcl\.Launcher)$, 
windowrulev2 = noblur , initialClass:^(org\.jackhuang\.hmcl\.Launcher)$, 

# wemeet
windowrulev2 = noborder , initialClass:^(wemeetapp)$, 
windowrulev2 = noshadow , initialClass:^(wemeetapp)$, 
windowrulev2 = noblur , initialClass:^(wemeetapp)$, 
windowrulev2 = pin , initialClass:^(wemeetapp)$, 

# --- Jetbrains sidebar buttons flickering issue ---
windowrule = noinitialfocus, class:(jetbrains-.*), title:^win(.*)

# --- HMCL popup flickering issue ---
windowrule = noinitialfocus, class:(org.jackhuang.hmcl.Launcher),

# App adaptations
#

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# -- waydroid --
## should set 
# setprop persist.waydroid.height 1200
# setprop persist.waydroid.width 1920
# useful: https://github.com/casualsnek/waydroid_script
windowrulev2 = fullscreen, class:Waydroid
windowrulev2 = fullscreen, class:waydroid.*

## Workspaces
#
# Don't think putting browsers or vscode into special worspaces
# is a wise solution,as I uses them a lot.
workspace = 200, defaultName:󰈹,on-created-empty: [] firefox 
workspace = 201, defaultName:󰨞,on-created-empty: [] code 
# workspace = 202, defaultName:󰘅,on-created-empty: [] qq
# workspace = 203, defaultName:󰘑,on-created-empty: [] QT_SCALE_FACTOR=1.6 wechat-uos
# workspace = 204, defaultName:󱓧,on-created-empty: [] obsidian 
# workspace = 205, defaultName:󰀲,on-created-empty: [] waydroid show-full-ui

workspace = 1,defaultName: 1,border:1,rounding:0,gapsin:0,gapsout:0, on-created-empty: [] kitty
# workspace = 2,defaultName: 2,border:0,rounding:0,gapsin:0,gapsout:0, on-created-empty: [] kitty tmux
workspace = 2,defaultName: 2,border:1,rounding:0,gapsin:0,gapsout:0, on-created-empty: [] kitty
workspace = 3,defaultName:󰭠 3 
workspace = 4,defaultName:󰭠 4 
workspace = 5,defaultName:󰭠 5 
workspace = 6,defaultName:󰭠 6 
workspace = 7,defaultName:󰭠 7 
workspace = 8,defaultName:󰭠 8 
workspace = 9,defaultName:󰭠 9 


## Special Workspaces

# --- NCM ---
windowrulev2 = workspace special:music,class:(com.gitee.gmg137.NeteaseCloudMusicGtk4)
# bind = SUPER, N, exec, pgrep -f netease-cloud-music-gtk4 && hyprctl dispatch togglespecialworkspace calculator || echo 1;netease-cloud-music-gtk4 & 
workspace = special:music, on-created-empty: [] netease-cloud-music-gtk4

# --- QQ ---
windowrulev2 = workspace special:qq,class:(QQ)
workspace = special:qq, on-created-empty: [] qq 

# --- Wechat ---
windowrulev2 = workspace special:wechat,class:(wechat)
workspace = special:wechat, on-created-empty: [] QT_SCALE_FACTOR=1.6 wechat-uos

# --- Obsidian ---
windowrulev2 = workspace special:obsidian,class:(obsidian)
workspace = special:obsidian, on-created-empty: [] obsidian

# --- Waydroid ---
windowrulev2 = workspace special:waydroid,class:(Waydroid)
windowrulev2 = workspace special:waydroid,class:(waydroid.*)
workspace = special:waydroid, on-created-empty: [] waydroid show-full-ui

# --- Zed ---
windowrulev2 = workspace special:zed,class:(dev.zed.Zed)
workspace = special:zed, on-created-empty: [] QT_SCALE_FACTOR=1.6 zeditor

